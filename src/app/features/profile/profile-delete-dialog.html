<dialog
  #dialog
  class="dialog"
  role="alertdialog"
  aria-labelledby="profile-delete-title"
  aria-describedby="profile-delete-text"
  (cancel)="onCancel($event)"
  (close)="onClose()"
>
  <div class="form">
    <h2 id="profile-delete-title" class="form__title">
      Silhouette „{{ profile()?.name }}“ löschen?
    </h2>
    <div id="profile-delete-text">
      <p class="form__warning" data-testid="delete-warning">
        <strong>Achtung:</strong> Alle für diese Silhouette erfassten Probleme werden ebenfalls
        gelöscht.
      </p>
      <p class="form__hint">Das Löschen kann nicht rückgängig gemacht werden.</p>
    </div>

    @if (deleteError(); as error) {
      <p class="form__error" role="alert">{{ error }}</p>
    }

    <div class="form__actions">
      <button
        type="button"
        class="button"
        data-testid="delete-cancel"
        [disabled]="deleting()"
        (click)="cancel()"
      >
        Abbrechen
      </button>
      <button
        type="button"
        class="button button--danger"
        data-testid="delete-confirm"
        [disabled]="deleting()"
        (click)="confirm()"
      >
        Endgültig löschen
      </button>
    </div>
  </div>
</dialog>
