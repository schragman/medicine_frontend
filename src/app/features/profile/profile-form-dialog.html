<dialog #dialog class="dialog" aria-labelledby="profile-form-title" (cancel)="cancel()">
  <form class="form" [formGroup]="form" (ngSubmit)="submit()">
    <h2 id="profile-form-title" class="form__title">Neue Silhouette anlegen</h2>
    <p class="form__hint">Felder mit * sind Pflichtfelder.</p>

    <div class="field">
      <label class="field__label" for="profile-name">Name *</label>
      <input
        id="profile-name"
        class="field__input"
        type="text"
        formControlName="name"
        autocomplete="off"
        required
        [attr.aria-invalid]="nameError() ? 'true' : null"
        [attr.aria-describedby]="nameError() ? 'profile-name-error' : null"
      />
      @if (nameError(); as error) {
        <p id="profile-name-error" class="field__error" role="alert">{{ error }}</p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="profile-birth-year">Geburtsjahr</label>
      <input
        id="profile-birth-year"
        class="field__input field__input--narrow"
        type="number"
        formControlName="birthYear"
        inputmode="numeric"
        [min]="earliestBirthYear"
        [max]="latestBirthYear"
        [attr.aria-invalid]="birthYearError() ? 'true' : null"
        [attr.aria-describedby]="birthYearError() ? 'profile-birth-year-error' : null"
      />
      @if (birthYearError(); as error) {
        <p id="profile-birth-year-error" class="field__error" role="alert">{{ error }}</p>
      }
    </div>

    <fieldset class="field field--choice">
      <legend class="field__label">Körperform</legend>
      @for (option of bodyForms; track option) {
        <label class="choice">
          <input type="radio" [value]="option" formControlName="bodyForm" />
          <span>{{ bodyFormLabels[option] }}</span>
        </label>
      }
    </fieldset>

    @if (submitError(); as error) {
      <p class="form__error" role="alert">{{ error }}</p>
    }

    <div class="form__actions">
      <button type="button" class="button" (click)="cancel()">Abbrechen</button>
      <button type="submit" class="button button--primary" [disabled]="submitting()">
        Anlegen
      </button>
    </div>
  </form>
</dialog>
